# Builds the Cube image the Formbricks Railway template pulls, and publishes it to
# ghcr.io/aalfath/formbricks-railway-cube. The template pins the image by digest.
name: image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/aalfath/formbricks-railway-cube:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/aalfath/formbricks-railway-template
            org.opencontainers.image.description=Cube service for the Formbricks Railway template
            org.opencontainers.image.licenses=AGPL-3.0-only
